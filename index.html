<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FaceOff</title>
  <meta name="description" content="Wie herkent de voetballer het snelst? Speel FaceOff 1-tegen-1.">
  <meta name="theme-color" content="#05070d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="bg" aria-hidden="true"><div class="beam b1"></div><div class="beam b2"></div><div class="pitch"></div></div>

  <!-- HOME: login → reel → logo → welkom → menu -->
  <section id="home" class="screen active" data-phase="login">
    <!-- reel (video's in de O) -->
    <div id="reel" aria-hidden="true">
      <div id="reel-clips"></div>
      <div id="reel-bars"></div>
      <div id="reel-cap"><small></small><span></span></div>
      <div id="reel-flash"></div>
    </div>

    <!-- logo met O -->
    <div id="brand">
      <div id="logo-wrap">
        <div class="logo-line">
          <span class="lt l-left">FACE</span><span class="o-slot" id="o-slot"></span><span class="lt l-right">FF</span>
        </div>
      </div>
      <div id="welcome">Welkom <b id="welcome-name"></b></div>
      <div id="tap-hint">Tik om verder te gaan</div>
    </div>

    <!-- login -->
    <div id="login">
      <div class="login-logo">FACE<span>OFF</span></div>
      <button id="btn-login" class="btn-start">LOGIN</button>
      <form id="login-form" hidden autocomplete="off">
        <input id="in-name" maxlength="20" placeholder="Jouw naam" autocomplete="nickname" enterkeyhint="go">
        <button type="submit" class="enter-btn" aria-label="Enter">↵</button>
      </form>
      <p class="intro-tip">Zet je geluid aan</p>
    </div>

    <!-- menu -->
    <div id="menu-opts">
      <button id="btn-create" class="btn primary">Kamer aanmaken</button>
      <div class="join-row">
        <input id="in-code" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters">
        <button id="btn-join" class="btn">Meedoen</button>
      </div>
      <button id="btn-solo" class="btn ghost">Alleen oefenen</button>
      <div class="menu-foot">
        <span class="small muted" id="db-stats"></span>
        <button id="btn-switch" class="linkbtn">Niet <span id="switch-name"></span>? Andere naam</button>
        <button id="btn-credits" class="linkbtn">Credits</button>
      </div>
      <div id="credits" class="small muted" hidden></div>
    </div>

    <div id="o-ring"></div>
    <button id="btn-skip" class="btn-ghost skip" hidden>Overslaan ›</button>
  </section>

  <!-- LOBBY -->
  <section id="lobby" class="screen">
    <div class="panel lobby-panel">
      <div class="lobby-head">
        <div>
          <div class="label">Kamercode</div>
          <div class="room-code" id="lobby-code">----</div>
        </div>
        <button id="btn-share" class="btn small">Link kopiëren</button>
      </div>
      <div class="versus">
        <div class="pcard" id="lobby-p1"><div class="avatar">1</div><div class="pname">…</div><div class="ptag">Host</div></div>
        <div class="vs">VS</div>
        <div class="pcard" id="lobby-p2"><div class="avatar">2</div><div class="pname">Wachten…</div><div class="ptag">Deel de code</div></div>
      </div>

      <div id="mode-picker">
        <div class="label">Spelmodus</div>
        <div class="mode-tabs" id="mode-tabs">
          <button data-type="bekend" class="active">Bekend</button>
          <button data-type="league">Competitie</button>
          <button data-type="club">Club</button>
          <button data-type="country">Land</button>
          <button data-type="legend">Legendes</button>
          <button data-type="alles">Alles</button>
          <button data-type="vrouwen">Vrouwen</button>
        </div>
        <div class="mode-sub" id="mode-sub"></div>
        <div class="label">Rondes</div>
        <div class="rounds" id="rounds">
          <button data-r="5">5</button><button data-r="10" class="active">10</button><button data-r="15">15</button><button data-r="20">20</button>
        </div>
      </div>
      <div class="mode-readonly" id="mode-readonly" hidden></div>

      <div class="mode-summary" id="mode-summary"></div>
      <button id="btn-go" class="btn primary big">Start de wedstrijd</button>
      <p class="small muted center" id="lobby-hint"></p>
      <button id="btn-leave" class="btn ghost small">Terug naar menu</button>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="screen">
    <header class="scorebar">
      <div class="side left" id="sb-p1"><span class="nm">Speler 1</span><span class="sc">0</span></div>
      <div class="mid"><div class="rnd" id="sb-round">Ronde 1/10</div><div class="mode" id="sb-mode"></div></div>
      <div class="side right" id="sb-p2"><span class="sc">0</span><span class="nm">Speler 2</span></div>
    </header>
    <div class="timer"><div id="timer-fill"></div></div>

    <div class="stage">
      <div class="photo-wrap" id="photo-wrap">
        <img id="photo" alt="Welke voetballer is dit?" referrerpolicy="no-referrer">
        <div class="countdown" id="countdown"></div>
        <div class="reveal" id="reveal" hidden>
          <div class="reveal-name" id="reveal-name"></div>
          <div class="reveal-who" id="reveal-who"></div>
        </div>
      </div>
      <div class="credit" id="credit"></div>
      <div class="hints" id="hints"></div>
    </div>

    <div class="answer">
      <div class="ac-wrap">
        <input id="in-guess" placeholder="Wie is dit?" autocomplete="off" spellcheck="false">
        <ul id="ac-list" class="ac-list" hidden></ul>
      </div>
      <button id="btn-guess" class="btn primary">Raad</button>
      <button id="btn-skipround" class="btn ghost" hidden>Weet ik niet</button>
    </div>
  </section>

  <div class="toast" id="toast"></div>

  <!-- END -->
  <section id="end" class="screen">
    <div class="panel end-panel">
      <div class="label">Eindstand</div>
      <div class="end-title" id="end-title"></div>
      <div class="end-scores" id="end-scores"></div>
      <button id="btn-again" class="btn primary">Nog een keer</button>
      <button id="btn-menu" class="btn ghost">Menu</button>
      <p class="small muted center" id="end-hint"></p>
    </div>
  </section>

  <button id="music-fix" class="music-fix" hidden>Tik hier om de muziek te starten</button>

  <!-- muziek -->
  <div class="music dim" id="music">
    <div class="music-art"><div id="yt"></div></div>
    <div class="music-meta">
      <div class="music-title">Feet Don't Fail Me Now</div>
      <div class="music-artist">Joy Crookes</div>
    </div>
    <button id="btn-mute" class="music-btn" title="Geluid aan/uit">♪</button>
  </div>

  <script src="https://www.youtube.com/iframe_api" async></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
